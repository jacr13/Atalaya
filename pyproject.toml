[tool.poetry]
name = "atalaya"
version = "0.3.1"
description = "Flexible experiment logging helpers for PyTorch projects."
authors = ["Joao Ramos <joao@cramos.ch>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "atalaya" }]
homepage = "https://github.com/jacr13/Atalaya"
repository = "https://github.com/jacr13/Atalaya"
keywords = ["pytorch", "tensorboard", "logging", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.scripts]
atalaya = "atalaya.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^2.2"
tensorboardX = "^2.6"
psutil = "^7.1"
wandb = { version = "^0.22", optional = true }
comet-ml = { version = "^3.54", optional = true }
clearml = { version = "^2.0", optional = true }
pluto-ml = { version = ">=0.0.29,<0.1", optional = true }
matplotlib = { version = "^3.10", optional = true }
seaborn = { version = "^0.13", optional = true }

[tool.poetry.extras]
wandb = ["wandb"]
comet = ["comet-ml"]
clearml = ["clearml"]
pluto = ["pluto-ml"]
visualization = ["matplotlib", "seaborn"]
all = [
    "wandb",
    "comet-ml",
    "clearml",
    "pluto-ml",
    "matplotlib",
    "seaborn",
]

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.24.4"
pytest = "^8.0"
tensorboard = "^2.15"  # tests read event files back
pandas = "^2.0"  # tests of atalaya.read

[tool.poe]
# POETRY_PYPI_TOKEN_PYPI for `poe publish`; .env is gitignored and left out of the sdist
envfile = ".env"

[tool.poe.tasks.clean-dist]
shell = "rm -rf dist build"

[tool.poe.tasks.publish]
sequence = ["clean-dist", { cmd = "poetry publish --build" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks.test]
cmd = "pytest -q"
