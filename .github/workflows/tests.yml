name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System tools used by the tests (video, pull)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg rsync
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest tensorboard pandas
      - name: Test
        env:
          PLUTO_DISABLE_TELEMETRY: "1"
        run: python -m pytest -q
